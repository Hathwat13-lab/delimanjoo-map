<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="전국 델리만쥬 판매 장소를 함께 기록하는 비영리 목록입니다.">
  <title>델리만쥬 판매처</title>
  <link rel="stylesheet" href="./style.css?v=3">
  <script src="./app.js?v=3" defer></script>
</head>
<body>
  <main class="container">
    <header><h1>델리만쥬 판매처</h1><p class="intro">전국 델리만쥬 판매 장소를 기록합니다.</p></header>
    <section aria-labelledby="list-title">
      <div class="list-heading"><h2 id="list-title">판매 장소</h2><span id="store-count" aria-live="polite">불러오는 중</span></div>
      <div class="filter-bar"><label for="region-filter">지역</label><select id="region-filter" disabled><option value="">전국</option></select></div>
      <p class="hint">장소명을 누르면 상세 정보가 펼쳐집니다.</p>
      <p id="load-status" role="status">목록을 불러오고 있습니다.</p>
      <div id="store-list"></div>
      <noscript><p>목록을 표시하려면 JavaScript를 켜 주세요. <a href="./data/stores.json">원본 데이터 보기</a></p></noscript>
    </section>
    <aside class="add-place-box"><span>알리고 싶은 매장이 있다면?</span><button id="add-place" type="button">장소 추가</button></aside>
    <footer><p>함께 채워가는 비영리 판매처 기록 · 첫 번째 버전</p><p>브랜드 공식 사이트가 아닙니다. 방문 전 영업 여부를 확인해 주세요.</p></footer>
  </main>
  <dialog id="add-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <h2 id="dialog-title">장소 추가</h2>
    <p id="dialog-description">입력한 내용으로 GitHub 제보 글을 만듭니다. 제출 전에 내용을 다시 확인할 수 있습니다.</p>
    <form id="add-place-form">
      <input type="hidden" name="id">
      <label>점포명 <strong aria-hidden="true">*</strong><input name="name" required maxlength="80" autocomplete="organization"></label>
      <label>주소 <strong aria-hidden="true">*</strong><input name="address" required maxlength="160" autocomplete="street-address"></label>
      <label>브랜드<input name="brand" maxlength="50" value="델리만쥬"></label>
      <label>전화번호<input name="phone" maxlength="30" inputmode="tel" autocomplete="tel"></label>
      <label>영업시간<input name="hours" maxlength="100"></label>
      <label>비고<textarea name="note" maxlength="500" rows="3"></textarea></label>
      <p class="form-note">제보 내용은 바로 목록에 등록되지 않으며, 확인 후 반영됩니다.</p>
      <div class="dialog-actions"><button type="button" id="cancel-add-place">취소</button><button type="submit" class="primary-button">GitHub에서 제보하기</button></div>
    </form>
  </dialog>
</body>
</html>
